# [Traggi] Gera a imagem Docker do frontend personalizado e publica no GitHub Container Registry.
name: Traggi - build imagem frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nome da imagem em minúsculas
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: APP_VERSION=traggi-${{ github.sha }}
          tags: |
            ghcr.io/${{ env.OWNER }}/evo-crm-frontend-traggi:latest
            ghcr.io/${{ env.OWNER }}/evo-crm-frontend-traggi:${{ github.sha }}
